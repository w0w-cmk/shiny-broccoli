<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无人机世界 | 简单互动版</title>
    <link rel="stylesheet" href="2.css">
</head>
<body>
<!-- 顶部轮播（图片 8.jpg - 11.jpg） -->
<div class="carousel" id="topCarousel">
    <div class="slides">
        <div class="slide active"><img src="8.jpg" alt="图8"></div>
        <div class="slide"><img src="9.jpg" alt="图9"></div>
        <div class="slide"><img src="10.jpg" alt="图10"></div>
        <div class="slide"><img src="11.jpg" alt="图11"></div>
    </div>
    <button class="carousel-btn prev" aria-label="上一张">‹</button>
    <button class="carousel-btn next" aria-label="下一张">›</button>
    <div class="dots"></div>
</div>

<nav class="navbar">
    <div class="logo">✈ 极飞视界</div>
    <ul class="nav-links">
        <li><a href="#">首页</a></li>
        <li><a href="#">机型</a></li>
        <li><a href="#" id="openModalBtn" class="login-btn">登录/注册</a></li>
    </ul>
</nav>

<div class="container">
    <h1>无人机类型介绍</h1>
    <div class="drone-grid">
        <div class="card"><img src="7.jpeg" alt="多旋翼" onerror="this.src='https://placehold.co/300x160?text=多旋翼'"><div class="info"><h3>多旋翼无人机</h3><p>垂直起降，航拍植保首选。</p></div></div>
        <div class="card"><img src="6.jpeg" alt="固定翼" onerror="this.src='https://placehold.co/300x160?text=固定翼'"><div class="info"><h3>固定翼无人机</h3><p>长航时，适合测绘巡检。</p></div></div>
        <div class="card"><img src="4.jpeg" alt="垂直起降固定翼" onerror="this.src='https://placehold.co/300x160?text=VTOL'"><div class="info"><h3>垂直起降固定翼</h3><p>灵活+长航程，应急救援利器。</p></div></div>
        <div class="card"><img src="5.jpeg" alt="直升机" onerror="this.src='https://placehold.co/300x160?text=直升机'"><div class="info"><h3>直升机无人机</h3><p>载重强，电力巡检专家。</p></div></div>
    </div>

    <!-- 教学资源区 动画依次弹出 -->
    <div class="resource-area">
        <h2>📚 教学资源</h2>
        <div class="resource-boxes" id="resourceBoxes">
            <div class="res-item">🎓 飞行理论</div>
            <div class="res-item">🕹️ 模拟飞行</div>
            <div class="res-item">🔧 组装维修</div>
            <div class="res-item">📸 航拍进阶</div>
        </div>
    </div>

    <!-- 留言社区 动态增删 -->
    <div class="message-board">
        <h3>💬 留言社区</h3>
        <div class="msg-list" id="msgList">
            <div class="msg-item"><span>✈️ 大疆Mini3 pro很稳！</span><button class="del-msg">删除</button></div>
            <div class="msg-item"><span>🚁 垂直起降固定翼太实用了</span><button class="del-msg">删除</button></div>
        </div>
        <div class="input-row">
            <input type="text" id="msgInput" placeholder="发布新留言...">
            <button id="publishBtn">发布</button>
        </div>
    </div>

    <!-- 飞行演示视频 + 组装标识 -->
    <div class="video-demo">
        <video controls>
            <source src="111.mp4" type="video/mp4">
            <source src="222.mp4" type="video/mp4">
        </video>
        <div class="info">
            <strong>🎬 无人机飞行演示</strong><br>
            <span style="color:#ffaa33;">我自己组装的</span><br>
            专业带组无人机 · 加微信咨询
        </div>
    </div>
    <footer>© 极飞视界 | 天空无界</footer>
</div>

<!-- 返回顶部按钮 -->
<div class="go-top" id="goTop">↑</div>

<!-- 登录/注册弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <div class="tabs">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>
        <!-- 登录表单 -->
        <div id="loginForm" class="form-panel active-panel">
            <div class="form-group"><input type="text" id="loginAccount" placeholder="邮箱/手机号"><div class="error" id="loginAccErr"></div></div>
            <div class="form-group"><input type="password" id="loginPwd" placeholder="密码"><div class="error" id="loginPwdErr"></div></div>
            <button class="submit-btn" id="doLogin">登录</button>
        </div>
        <!-- 注册表单 -->
        <div id="regForm" class="form-panel">
            <div class="form-group"><input type="text" id="regName" placeholder="用户名"><div class="error" id="regNameErr"></div></div>
            <div class="form-group"><input type="password" id="regPwd" placeholder="密码(至少6位)"><div class="error" id="regPwdErr"></div></div>
            <div class="form-group">
                <div class="verify-row">
                    <input type="text" id="regPhone" placeholder="手机号">
                    <button id="getCodeBtn" type="button">获取验证码</button>
                </div>
                <div class="error" id="codeErr"></div>
                <input type="text" id="smsCode" placeholder="验证码" style="margin-top:5px;">
            </div>
            <button class="submit-btn" id="doRegister">注册</button>
        </div>
    </div>
</div>

<!-- 登录成功提示 -->
<div id="loginTip" class="toast"></div>

<script>
    // ========== 1. 弹出框显示/隐藏 ==========
    const modalEl = document.getElementById('modal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModal');
    openModalBtn.onclick = (e) => { e.preventDefault(); modalEl.classList.add('active'); };
    closeModalBtn.onclick = () => modalEl.classList.remove('active');
    modalEl.onclick = (e) => { if(e.target === modalEl) modalEl.classList.remove('active'); };

    // ========== 2. Tab 切换 ==========
    const tabs = document.querySelectorAll('.tab');
    const loginPanel = document.getElementById('loginForm');
    const regPanel = document.getElementById('regForm');
    tabs.forEach(tab => {
        tab.onclick = () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            if(tab.dataset.tab === 'login') {
                loginPanel.classList.add('active-panel');
                regPanel.classList.remove('active-panel');
            } else {
                regPanel.classList.add('active-panel');
                loginPanel.classList.remove('active-panel');
            }
        };
    });

    // ========== 3. 表单验证（登录+注册） ==========
    // 登录验证
    document.getElementById('doLogin').onclick = () => {
        const account = document.getElementById('loginAccount').value.trim();
        const pwd = document.getElementById('loginPwd').value.trim();
        let ok = true;
        if(!account || (!/^\S+@\S+\.\S+$/.test(account) && !/^\d{11}$/.test(account))) {
            document.getElementById('loginAccErr').innerText = '请输入邮箱或11位手机号';
            ok = false;
        } else document.getElementById('loginAccErr').innerText = '';
        if(!pwd || pwd.length < 3) {
            document.getElementById('loginPwdErr').innerText = '密码至少3位';
            ok = false;
        } else document.getElementById('loginPwdErr').innerText = '';
        if(ok) {
            showToast('登录成功');
            modalEl.classList.remove('active');
        }
    };

    // 注册验证 + 获取验证码倒计时
    let timer = null;
    let counting = false;
    const getCodeBtn = document.getElementById('getCodeBtn');
    getCodeBtn.onclick = () => {
        if(counting) return;
        let sec = 60;
        counting = true;
        getCodeBtn.disabled = true;
        getCodeBtn.innerText = `${sec}秒后重试`;
        timer = setInterval(() => {
            sec--;
            if(sec <= 0) {
                clearInterval(timer);
                getCodeBtn.disabled = false;
                getCodeBtn.innerText = '获取验证码';
                counting = false;
            } else {
                getCodeBtn.innerText = `${sec}秒后重试`;
            }
        }, 1000);
        alert('验证码已发送：123456');
        document.getElementById('smsCode').value = '123456';
    };

    document.getElementById('doRegister').onclick = () => {
        showToast('注册成功');
        modalEl.classList.remove('active');
    };

    function showToast(message) {
        const loginTip = document.getElementById('loginTip');
        loginTip.innerText = message;
        loginTip.classList.add('show');
        setTimeout(() => loginTip.classList.remove('show'), 2000);
    }

    // ========== 顶部轮播（8-11号图片） ==========
    (function(){
        const carousel = document.getElementById('topCarousel');
        if(!carousel) return;
        const slides = Array.from(carousel.querySelectorAll('.slide'));
        const prevBtn = carousel.querySelector('.prev');
        const nextBtn = carousel.querySelector('.next');
        const dotsContainer = carousel.querySelector('.dots');
        let current = 0;
        let timer = null;

        function goTo(index){
            slides[current].classList.remove('active');
            if(dotsContainer.children[current]) dotsContainer.children[current].classList.remove('active');
            current = (index + slides.length) % slides.length;
            slides[current].classList.add('active');
            if(dotsContainer.children[current]) dotsContainer.children[current].classList.add('active');
        }
        function nextSlide(){ goTo(current+1); }
        function prevSlide(){ goTo(current-1); }
        function start(){ timer = setInterval(nextSlide, 3000); }
        function stop(){ clearInterval(timer); }
        function reset(){ stop(); start(); }

        slides.forEach((s,i)=>{
            const dot = document.createElement('button');
            dot.className = 'dot' + (i===0? ' active':'');
            dot.addEventListener('click', ()=>{ goTo(i); reset(); });
            dotsContainer.appendChild(dot);
        });
        nextBtn.addEventListener('click', ()=>{ nextSlide(); reset(); });
        prevBtn.addEventListener('click', ()=>{ prevSlide(); reset(); });
        carousel.addEventListener('mouseenter', stop);
        carousel.addEventListener('mouseleave', start);
        start();
    })();

    // ========== 4. 返回顶部按钮 ==========
    const goTopBtn = document.getElementById('goTop');
    window.onscroll = () => {
        if(window.scrollY > 300) goTopBtn.classList.add('show');
        else goTopBtn.classList.remove('show');
    };
    goTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    // ========== 5. 动画效果：资源盒子依次弹出 ==========
    const items = document.querySelectorAll('.res-item');
    function animateBoxes() {
        items.forEach((box, idx) => {
            setTimeout(() => box.classList.add('visible'), idx * 150);
        });
    }
    // 页面加载即触发动画
    window.addEventListener('load', animateBoxes);

    // ========== 6. 动态创建/删除元素（留言社区） ==========
    const msgContainer = document.getElementById('msgList');
    const publish = document.getElementById('publishBtn');
    const msgInput = document.getElementById('msgInput');

    function addMessage(text) {
        if(!text.trim()) return alert('留言不能为空');
        const div = document.createElement('div');
        div.className = 'msg-item';
        div.innerHTML = `<span>✈️ ${escapeHtml(text)}</span><button class="del-msg">删除</button>`;
        msgContainer.prepend(div);
        div.querySelector('.del-msg').onclick = () => div.remove();
        msgInput.value = '';
    }
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    // 绑定现有删除按钮
    document.querySelectorAll('.del-msg').forEach(btn => {
        btn.onclick = (e) => btn.parentElement.remove();
    });
    publish.onclick = () => addMessage(msgInput.value);
    msgInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') addMessage(msgInput.value); });
</script>
</body>
</html>
